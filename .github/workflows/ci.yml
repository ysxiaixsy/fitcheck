name: Verify FitCheck

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          npm ci
          npx playwright install --with-deps chromium
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze Flutter
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build emulator review app
        run: flutter build web --debug --dart-define=USE_FIREBASE_EMULATORS=true --output=build/web-emulator --no-wasm-dry-run
      - name: Verify Firebase rules and browser flows
        run: npx firebase emulators:exec --project demo-fitcheck --only auth,firestore,storage "npm run test:rules && npm run test:web"
      - name: Build production web target
        run: flutter build web --release --no-wasm-dry-run
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            artifacts/
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save production web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7
